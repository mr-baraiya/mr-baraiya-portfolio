<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Mr. Baraiya Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #050508;
      color: #F8FAFC;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #0c0d14;
      border: 1px solid rgba(21, 216, 179, 0.25);
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 0 60px rgba(21, 216, 179, 0.06);
    }
    .icon-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(21, 216, 179, 0.08);
      border: 1px solid rgba(21, 216, 179, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
    }
    .label {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #15D8B3;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #F8FAFC;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    p {
      font-size: 14px;
      color: rgba(248,250,252,0.65);
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 12px;
      background: #15D8B3;
      color: #050508;
      font-weight: 700;
      font-size: 13px;
      font-family: 'Fira Code', monospace;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #12be9d; }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      animation: blink 1.4s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-ring">📡</div>
    <div class="label"><span class="dot"></span>&nbsp; No Connection</div>
    <h1>You're Offline</h1>
    <p>
      Looks like you've lost your internet connection.<br />
      Pages you've visited recently are still available from cache.
    </p>
    <button class="btn" onclick="window.location.reload()">
      ↺ &nbsp;Try Again
    </button>
  </div>
</body>
</html>
